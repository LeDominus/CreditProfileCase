services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit-backend
    env_file: .env
    environment:
      DATABASE_URI: sqlite:///data/database.db
    ports:
      - "${BACKEND_PORT:-5555}:5555"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5555/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Next.js frontend (front/). The legacy Streamlit UI in frontend/ stays in
  # the repo as a demo fallback but is no longer part of the compose stack.
  frontend:
    build:
      context: ./front
      args:
        # Baked into rewrites at image build time (dist/routes-manifest.json).
        BACKEND_URL: http://backend:5555
    container_name: credit-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8502}:8502"
    restart: unless-stopped
