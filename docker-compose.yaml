services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit-backend
    env_file: .env
    environment:
      DATABASE_URI: sqlite:///data/database.db
    ports:
      - "${BACKEND_PORT:-5555}:5555"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5555/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: credit-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_BASE_URL: http://backend:5555
      DEMO_MODE: "false"
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    restart: unless-stopped
