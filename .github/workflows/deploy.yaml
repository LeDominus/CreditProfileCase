name: CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Deploy frontend to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          script: |
            set -e
            PROJECT_DIR="${{ secrets.PROJECT_DIR }}"
            REPO="https://github.com/LeDominus/CreditProfileCase.git"
            FRONTEND_PORT="${FRONTEND_PORT:-8502}"

            mkdir -p "$PROJECT_DIR"
            cd "$PROJECT_DIR"
            if [ ! -d .git ]; then
              echo "First deploy: initializing repository..."
              git init -q
              git remote add origin "$REPO" 2>/dev/null || git remote set-url origin "$REPO"
            fi
            git fetch origin master
            git reset --hard origin/master

            if [ ! -f .env ]; then
              echo "ERROR: $PROJECT_DIR/.env not found."
              echo "Create it first: YANDEX_API_KEY, YANDEX_FOLDER, MODEL_NAME, BASE_URL, TEMPERATURE, ..."
              exit 1
            fi

            # --no-deps: frontend goes live before backend (deploy chain:
            # frontend -> backend tests -> backend); backend is built and
            # started by its own stage and must not be built twice.
            docker compose up -d --build --no-deps frontend

            # Health-check: Next.js answers on / (a redirect to /login is
            # fine — curl -f fails only on HTTP >= 400).
            for i in $(seq 1 15); do
              if curl -fsS -o /dev/null "http://localhost:$FRONTEND_PORT/"; then
                echo "Frontend deploy OK: / responds."
                exit 0
              fi
              sleep 5
            done
            echo "ERROR: frontend did not respond after deploy. Last frontend logs:"
            docker compose logs --tail=50 frontend
            exit 1


  tests:
    name: Backend tests
    needs: deploy-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

  deploy:
    name: Deploy backend to VPS
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          script: |
            set -e
            PROJECT_DIR="${{ secrets.PROJECT_DIR }}"
            REPO="https://github.com/LeDominus/CreditProfileCase.git"
            BACKEND_PORT="${BACKEND_PORT:-5555}"

            mkdir -p "$PROJECT_DIR"
            cd "$PROJECT_DIR"
            if [ ! -d .git ]; then
              echo "First deploy: initializing repository..."
              git init -q
              git remote add origin "$REPO" 2>/dev/null || git remote set-url origin "$REPO"
            fi
            git fetch origin master
            git reset --hard origin/master

            if [ ! -f .env ]; then
              echo "ERROR: $PROJECT_DIR/.env not found."
              echo "Create it first: YANDEX_API_KEY, YANDEX_FOLDER, MODEL_NAME, BASE_URL, TEMPERATURE, ..."
              exit 1
            fi

            # Frontend is already up (deploy-frontend stage) — build backend only.
            docker compose up -d --build backend
            docker image prune -f

            # 4. Post-deploy health-check: /health должен ответить за ~75 сек.
            for i in $(seq 1 15); do
              if curl -fsS "http://localhost:$BACKEND_PORT/health" >/dev/null 2>&1; then
                echo "Deploy OK: /health responds."
                exit 0
              fi
              sleep 5
            done
            echo "ERROR: /health did not respond after deploy. Last backend logs:"
            docker compose logs --tail=50 backend
            exit 1