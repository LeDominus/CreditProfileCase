name: CI/CD

# Деплой запускается только после зелёных тестов (job needs).
on:
  push:
    branches:
      - master
  workflow_dispatch: # ручной запуск из UI Actions

# Не пускаем параллельные деплои: новый ран ждёт завершения предыдущего.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

      # Линт подключим отдельным коммитом после чистки замечаний ruff:
      # - name: Lint (ruff)
      #   run: ruff check .

  deploy:
    name: Deploy to VPS
    needs: tests # деплой только если тесты зелёные
    runs-on: ubuntu-latest
    # environment: production # опционально: защита с ручным approval в Settings → Environments
    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }} # используется, если SSH_KEY пустой
          script_stop: true # стоп на первой ошибке (иначе ошибки в script незаметны)
          script: |
            set -e
            PROJECT_DIR="${{ secrets.PROJECT_DIR }}"
            REPO="https://github.com/LeDominus/CreditProfileCase.git"
            BACKEND_PORT="${BACKEND_PORT:-5555}"

            # 1. Код: первый запуск — clone, дальше — жёсткая синхронизация с origin/master.
            #    reset --hard не трогает untracked-файлы (.env, data/) — секреты и БД остаются на месте.
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "First deploy: cloning repository..."
              git clone "$REPO" "$PROJECT_DIR"
            else
              cd "$PROJECT_DIR"
              git fetch origin master
              git reset --hard origin/master
            fi
            cd "$PROJECT_DIR"

            # 2. .env обязателен (в репо его нет — создаётся на VPS один раз вручную).
            if [ ! -f .env ]; then
              echo "ERROR: $PROJECT_DIR/.env not found."
              echo "Create it first: YANDEX_API_KEY, YANDEX_FOLDER, MODEL_NAME, BASE_URL, TEMPERATURE, ..."
              exit 1
            fi

            # 3. Пересборка и запуск стека.
            docker compose up -d --build
            docker image prune -f

            # 4. Post-deploy health-check: /health должен ответить за ~75 сек.
            for i in $(seq 1 15); do
              if curl -fsS "http://localhost:$BACKEND_PORT/health" >/dev/null 2>&1; then
                echo "Deploy OK: /health responds."
                exit 0
              fi
              sleep 5
            done
            echo "ERROR: /health did not respond after deploy. Last backend logs:"
            docker compose logs --tail=50 backend
            exit 1